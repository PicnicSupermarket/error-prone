before_install:
  - mvn -version
  - source "${HOME}/.sdkman/bin/sdkman-init.sh"
  - sdk update
  - sdk install java 21.0.13.0+9-tem
  - sdk install java 25.0.5.0+8-tem
  - sdk use java 25.0.5.0+8-tem
  - sdk install maven 3.10.0
  - sdk use maven 3.10.0
  - mvn org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper -Dmaven=3.10.0
install:
  - ./mvnw clean install -DskipTests --toolchains jitpack-toolchains.xml
