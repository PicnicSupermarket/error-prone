before_install:
  - mvn -version
  - source "${HOME}/.sdkman/bin/sdkman-init.sh"
  - sdk update
  - sdk install java 21.0.9-tem
  - sdk install java 25.0.4.1+1-tem
  - sdk use java 25.0.4.1+1-tem
  - sdk install maven 3.9.12
  - sdk use maven 3.9.12
  - mvn org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper -Dmaven=3.9.12
install:
  - ./mvnw clean install -DskipTests --toolchains jitpack-toolchains.xml
